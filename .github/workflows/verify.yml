name: Verify

on:
  # Trigger the workflow on push or pull request on master branch
  pull_request:
    branches:
    - master

jobs:
  build:
    name: Build
    # Ubuntu 24.04 (ubuntu-latest) sets kernel.apparmor_restrict_unprivileged_userns=1,
    # which makes the rootless podman re-exec fail with "failed to reexec: Permission denied".
    runs-on: ubuntu-22.04

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Build & Test
      run: make images test
