name: Release

on:
  push:
    # Publish `master` as Docker `latest` image.
    branches:
    - master

    tags:
    - v*
    - main


env:
  PODMAN_IMAGE: podman
  PODMAN_MINIMAL_IMAGE: podman-minimal
  PODMAN_REMOTE_IMAGE: podman-remote

jobs:
  push:
    # Ubuntu 24.04 (ubuntu-latest) sets kernel.apparmor_restrict_unprivileged_userns=1,
    # which makes the rootless podman re-exec fail with "failed to reexec: Permission denied".
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Build & Test
      run: make images test

    # Mirrors upstream: the archive is only signed when it is actually released,
    # so a plain push to master needs no GPG secrets.
    - name: Build archive
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: make tar

    - name: Build signed archive
      if: startsWith(github.ref, 'refs/tags/')
      run: make signed-tar
      env:
        GPG_SIGN_KEY: ${{ secrets.GPG_SIGN_KEY }}
        GPG_SIGN_KEY_PASSPHRASE: ${{ secrets.GPG_SIGN_KEY_PASSPHRASE }}

    - name: Log into GitHub registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login docker.pkg.github.com -u ${{ github.actor }} --password-stdin

    # - name: Log into DockerHub registry
      # run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
#

    - name: Create Release
      if: github.ref != 'refs/heads/master'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        allowUpdates: true
        prerelease: false

   
        
    - name: Upload amd64 binary
      if: github.ref != 'refs/heads/master'
      id: upload-archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        asset_path: ./build/podman-linux-amd64.tar.gz
        asset_name: podman-linux-amd64.tar.gz
        asset_content_type: application/octet-stream

    - name: Upload amd64 signature
      if: github.ref != 'refs/heads/master'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./build/podman-linux-amd64.tar.gz.asc
        asset_name: podman-linux-amd64.tar.gz.asc
        asset_content_type: application/pgp-signature
