# Podman-static-specific storage settings.
# Storage locations are resolved by Podman per execution mode. The installer
# can override them through CONTAINERS_STORAGE_CONF when a private root is
# required.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/local/bin/fuse-overlayfs"
ignore_chown_errors = "true"
